<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site footer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/b8569f53f40f3bff4438ba4f6b0942a3">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IM+Fell+English:ital@0;1&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="{{scope}}">
<div class="wrap">
<sc-if value="{{showCta}}" hint-placeholder-val="{{ true }}">
<div class="cta-strip">
<h2>Let’s work <em>together.</em></h2>
<a href="Contact.dc.html" class="btn btn-ink">Break the seal <span class="arr">→</span></a>
</div>
</sc-if>
<footer class="sitefoot" style="border-top: 1px solid var(--ink); margin-top: 24px">
<p style="margin: 0; max-width: 60ch; font-size: 14px; line-height: 1.6; color: var(--ink-2)"><span class="mono" style="color: var(--ink)">Colophon — </span>Set in IM Fell English, Newsreader, Antonio &amp; IBM Plex Mono. Independent views on software, design, and urbanism. Content is for general information, not professional advice.</p>
<nav aria-label="Footer" style="display: flex; flex-wrap: wrap; gap: 4px 22px; align-items: center">
<span class="mono" style="color: var(--ink-2)">© 2026 Ruben Verdin</span>
<a href="Main.dc.html" class="mono" style="text-decoration: none; padding: 12px 0">RSS</a>
<a href="Main.dc.html" class="mono" style="text-decoration: none; padding: 12px 0">Privacy</a>
<a href="Main.dc.html" class="mono" style="text-decoration: none; padding: 12px 0">Sitemap</a>
</nav>
</footer>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"inPage": {"editor": null, "default": false}, "showCta": {"editor": "boolean", "default": true}, "$preview": {"width": 1440, "height": 360}}'>
class Component extends DCLogic {
  renderVals() {
    var scope = this.props.inPage ? 'cmp' : 'cmp theme-day cmp-alone';
    return { scope: scope, showCta: this.props.showCta !== false };
  }
}
</script>
</body>
</html>
