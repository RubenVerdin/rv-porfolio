<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cross-link banner</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/b8569f53f40f3bff4438ba4f6b0942a3">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IM+Fell+English:ital@0;1&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="{{scope}}">
<section class="xb" aria-label="{{kicker}}">
<svg class="xb-sea" viewBox="0 0 1440 680" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs><mask id="xbMask" maskUnits="userSpaceOnUse" x="-100" y="0" width="1640" height="680"><path class="xb-route-mask" pathLength="1000" d="M-40,560 C220,600 360,420 560,470 C760,520 860,640 980,520 C1060,440 1080,360 1180,320"></path></mask><path id="xbRoute" d="M-40,560 C220,600 360,420 560,470 C760,520 860,640 980,520 C1060,440 1080,360 1180,320"></path></defs>
<line class="xb-grat" x1="0" y1="80" x2="1440" y2="80"></line><line class="xb-grat" x1="0" y1="200" x2="1440" y2="200"></line><line class="xb-grat" x1="0" y1="320" x2="1440" y2="320"></line><line class="xb-grat" x1="0" y1="440" x2="1440" y2="440"></line><line class="xb-grat" x1="0" y1="560" x2="1440" y2="560"></line><line class="xb-grat" x1="0" y1="680" x2="1440" y2="680"></line><line class="xb-grat" x1="120" y1="0" x2="120" y2="680"></line><line class="xb-grat" x1="300" y1="0" x2="300" y2="680"></line><line class="xb-grat" x1="480" y1="0" x2="480" y2="680"></line><line class="xb-grat" x1="660" y1="0" x2="660" y2="680"></line><line class="xb-grat" x1="840" y1="0" x2="840" y2="680"></line><line class="xb-grat" x1="1020" y1="0" x2="1020" y2="680"></line><line class="xb-grat" x1="1200" y1="0" x2="1200" y2="680"></line><line class="xb-grat" x1="1380" y1="0" x2="1380" y2="680"></line>
<line class="xb-rh a" x1="1180" y1="320" x2="2880" y2="320"></line><line class="xb-rh" x1="1180" y1="320" x2="2847" y2="652"></line><line class="xb-rh" x1="1180" y1="320" x2="2751" y2="971"></line><line class="xb-rh" x1="1180" y1="320" x2="2593" y2="1264"></line><line class="xb-rh a" x1="1180" y1="320" x2="2382" y2="1522"></line><line class="xb-rh" x1="1180" y1="320" x2="2124" y2="1733"></line><line class="xb-rh" x1="1180" y1="320" x2="1831" y2="1891"></line><line class="xb-rh" x1="1180" y1="320" x2="1512" y2="1987"></line><line class="xb-rh a" x1="1180" y1="320" x2="1180" y2="2020"></line><line class="xb-rh" x1="1180" y1="320" x2="848" y2="1987"></line><line class="xb-rh" x1="1180" y1="320" x2="529" y2="1891"></line><line class="xb-rh" x1="1180" y1="320" x2="236" y2="1733"></line><line class="xb-rh a" x1="1180" y1="320" x2="-22" y2="1522"></line><line class="xb-rh" x1="1180" y1="320" x2="-233" y2="1264"></line><line class="xb-rh" x1="1180" y1="320" x2="-391" y2="971"></line><line class="xb-rh" x1="1180" y1="320" x2="-487" y2="652"></line><line class="xb-rh a" x1="1180" y1="320" x2="-520" y2="320"></line><line class="xb-rh" x1="1180" y1="320" x2="-487" y2="-12"></line><line class="xb-rh" x1="1180" y1="320" x2="-391" y2="-331"></line><line class="xb-rh" x1="1180" y1="320" x2="-233" y2="-624"></line><line class="xb-rh a" x1="1180" y1="320" x2="-22" y2="-882"></line><line class="xb-rh" x1="1180" y1="320" x2="236" y2="-1093"></line><line class="xb-rh" x1="1180" y1="320" x2="529" y2="-1251"></line><line class="xb-rh" x1="1180" y1="320" x2="848" y2="-1347"></line><line class="xb-rh a" x1="1180" y1="320" x2="1180" y2="-1380"></line><line class="xb-rh" x1="1180" y1="320" x2="1512" y2="-1347"></line><line class="xb-rh" x1="1180" y1="320" x2="1831" y2="-1251"></line><line class="xb-rh" x1="1180" y1="320" x2="2124" y2="-1093"></line><line class="xb-rh a" x1="1180" y1="320" x2="2382" y2="-882"></line><line class="xb-rh" x1="1180" y1="320" x2="2593" y2="-624"></line><line class="xb-rh" x1="1180" y1="320" x2="2751" y2="-331"></line><line class="xb-rh" x1="1180" y1="320" x2="2847" y2="-12"></line>
<g transform="translate(1180 320)"><g class="xb-rose"><circle class="ring" r="200"></circle><circle class="ring" r="188"></circle><circle class="ring" r="120"></circle><polygon class="star" points="0.0,-150.0 10.7,-25.9 56.6,-56.6 25.9,-10.7 150.0,0.0 25.9,10.7 56.6,56.6 10.7,25.9 0.0,150.0 -10.7,25.9 -56.6,56.6 -25.9,10.7 -150.0,0.0 -25.9,-10.7 -56.6,-56.6 -10.7,-25.9"></polygon><polygon class="n" points="0,-150 10,-28 0,0 -10,-28"></polygon></g></g>
<path class="xb-route" d="M-40,560 C220,600 360,420 560,470 C760,520 860,640 980,520 C1060,440 1080,360 1180,320" mask="url(#xbMask)"></path>
<circle class="xb-pulse" cx="1180" cy="320" r="12"></circle>
<circle class="xb-port" cx="1180" cy="320" r="10"></circle><circle class="xb-port-dot" cx="1180" cy="320" r="4"></circle>
<g class="xb-ship"><animateMotion dur="7s" begin="0.4s" fill="freeze" rotate="auto" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.6 0.1 0.4 1"><mpath href="#xbRoute"></mpath></animateMotion>
<g transform="translate(0 -6) scale(1.6)"><g class="bob"><path class="hull" d="M-13,0 L13,0 L8,6 L-9,6 Z"></path><path class="sail" d="M0,-1 L0,-20 L11,-2 Z"></path><path class="sail" d="M-2,-17 L-11,-2 L-2,-2 Z"></path><path class="flag" d="M0,-20 L6,-23 L0,-25 Z"></path></g></g></g>
</svg>
<div class="wrap xb-in">
<span class="mono xb-kick">{{kicker}}</span>
<h2><a href="{{href}}">{{title}} <em>{{accent}}</em></a></h2>
<p class="xb-dek">{{dek}}</p>
<a href="{{href}}" class="btn">{{cta}} <span class="arr">→</span></a>
</div>
<div class="xb-ribbon" aria-hidden="true"><div class="xb-track">
<sc-for list="{{ribbon}}" as="r" hint-placeholder-count="8"><span>{{r}}</span></sc-for>
</div></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"inPage": {"editor": null, "default": false}, "kicker": {"editor": "text", "default": "Next port · Correspondence"}, "title": {"editor": "text", "default": "Read the"}, "accent": {"editor": "text", "default": "dispatches."}, "dek": {"editor": "text", "default": "Essays on craft &amp; cities — sent from Toronto."}, "cta": {"editor": "text", "default": "Open the correspondence"}, "href": {"editor": "text", "default": "WritingList.dc.html"}, "words": {"editor": "text", "default": "Correspondence|essays|Dispatches|notes"}, "$preview": {"width": 1440, "height": 680}}'>
class Component extends DCLogic {
  renderVals() {
    var scope = this.props.inPage ? 'cmp' : 'cmp theme-day cmp-alone';
    var p = this.props;
    var words = (p.words || 'Correspondence|essays|Dispatches|notes').split('|');
    var ribbon = [];
    for (var i = 0; i < 4; i++) { ribbon = ribbon.concat(words); }
    return {
      scope: scope,
      kicker: p.kicker ?? 'Next port · Correspondence',
      title: p.title ?? 'Read the',
      accent: p.accent ?? 'dispatches.',
      dek: p.dek ?? 'Essays on craft & cities — sent from Toronto.',
      cta: p.cta ?? 'Open the correspondence',
      href: p.href ?? 'WritingList.dc.html',
      ribbon: ribbon
    };
  }
}
</script>
</body>
</html>
