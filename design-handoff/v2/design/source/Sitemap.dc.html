<script type="text/x-dc" data-dc-script data-props='{"edition": {"editor": "enum", "options": ["Day", "Night"], "default": "Day"}, "$preview": {"width": 1440, "height": 2200}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { night: null };
  }
  renderVals() {
    var self = this;
    var night = this.state.night !== null ? this.state.night : (this.props.edition === 'Night');
    return {
      themeClass: night ? 'theme-night' : 'theme-day',
      night: night,
      setDay: function () { self.setState({ night: false }); },
      setNight: function () { self.setState({ night: true }); }
    };
  }
}
</script>
